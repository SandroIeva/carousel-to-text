<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Carousel → Text</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1017;color:#f5f6fa;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:780px;margin:8vh auto;padding:22px}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-2px;margin:0 0 10px}.sub{color:#a3aaba;margin:0 0 32px}.panel{border:1px solid #303642;background:#171b25;border-radius:18px;padding:24px}label{display:block;font-size:13px;margin-bottom:8px;color:#b7bdca}input{width:100%;padding:14px;border:1px solid #394253;border-radius:10px;background:#0e1119;color:white;font-size:15px}button{border:0;background:#d9fc76;color:#19200d;border-radius:10px;padding:14px 20px;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.55;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#11151e;padding:18px;border-radius:12px;max-height:500px;overflow:auto;color:#e4e9f2}.actions{display:flex;gap:10px}.actions button{background:#252d3b;color:#f5f6fa}#status{color:#b9c0cc;font-size:14px;margin-top:16px}.muted{font-size:13px;color:#9098a9}#result{margin-top:26px;display:none}</style></head><body><main class="wrap"><p class="muted">CONTENT TOOL / MVP 01</p><h1>Carousel → Text</h1><p class="sub">Ein Instagram-Link rein. Alle Slides als strukturierte Markdown-Datei raus.</p><div class="panel"><form id="form"><label for="url">Instagram Carousel URL</label><input id="url" type="url" required placeholder="https://www.instagram.com/p/…"/><button id="extract" type="submit">Extract slides →</button></form><div id="status" role="status" aria-live="polite"></div><section id="result"><p id="summary"></p><div class="actions"><button id="download" type="button">↓ Markdown herunterladen</button><button id="copy" type="button">Text kopieren</button></div><pre id="preview"></pre></section></div><p class="muted">Nur öffentliche Instagram-Bilder. Keine Videos. Texte werden originalgetreu transkribiert; bitte bei wichtigen Zahlen gegenprüfen.</p></main><script>const form=document.getElementById('form'),status=document.getElementById('status'),preview=document.getElementById('preview'),result=document.getElementById('result'),btn=document.getElementById('extract');let current='';form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;result.style.display='none';status.textContent='Instagram-Post und Slides werden verarbeitet …';try{const resp=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value})});const body=await resp.json();if(!resp.ok)throw Error(body.error||'Unbekannter Fehler');current=body.markdown;preview.textContent=current;document.getElementById('summary').textContent=`${body.slides} Slides verarbeitet${body.failed?' · '+body.failed+' fehlgeschlagen':''}`;result.style.display='block';status.textContent='Extraktion abgeschlossen.'}catch(err){status.textContent='Fehler: '+err.message}finally{btn.disabled=false}});document.getElementById('download').onclick=()=>{const blob=new Blob([current],{type:'text/markdown;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='instagram-carousel.md';a.click();URL.revokeObjectURL(u)};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(current);</script></body></html>
